<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Access4All — verified accessible places, by the community. Filter hotels, stays, airports, and wheelchair vans by real features." />
  <title>Access4All — verified accessible places</title>
  <meta name="theme-color" content="#0f5c68" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Access4All" />
  <link rel="icon" href="/favicon.svg?v=isa" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html { color-scheme: light; background: #f3eee4; }
    html, body { margin: 0; width: 100%; min-height: 100vh; background: #f3eee4; color: #142024; font-family: "Source Sans 3", system-ui, sans-serif; }
    #root { width: 100%; min-height: 100vh; }
    .font-display, h1, h2, h3 { font-family: Fraunces, Georgia, serif; }
  </style>
</head>
<body class="antialiased">
  <div id="root">
    <div id="a4a-boot" style="margin:0;padding:2rem;font-family:'Source Sans 3',system-ui,sans-serif;color:#0f5c68;background:#f3eee4;min-height:100vh;box-sizing:border-box">
      <p style="margin:0 0 0.75rem;font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.25rem">Opening Access4All…</p>
      <p id="a4a-boot-hint" style="margin:0;font-size:0.9rem;color:#4a5b60">Loading accessible travel search.</p>
      <p style="margin:1.25rem 0 0">
        <button type="button" id="a4a-boot-reload" style="min-height:44px;padding:0.65rem 1.1rem;border:0;border-radius:999px;background:#0f5c68;color:#fff;font:inherit;font-weight:600">Reload</button>
      </p>
    </div>
  </div>
  <script>
    (function () {
      var btn = document.getElementById('a4a-boot-reload');
      if (btn) {
        btn.onclick = function () {
          var u = new URL(location.href);
          u.searchParams.set('_r', String(Date.now()));
          location.replace(u.toString());
        };
      }
      function fail(msg) {
        var hint = document.getElementById('a4a-boot-hint');
        if (hint) hint.textContent = msg;
      }
      window.addEventListener('error', function (ev) {
        if (ev && ev.target && ev.target.tagName === 'SCRIPT') {
          fail('App script failed to load. Tap Reload — or try a private tab.');
        }
      }, true);
      setTimeout(function () {
        if (document.getElementById('a4a-boot')) {
          fail('Still loading? Tap Reload or open a private tab.');
        }
      }, 12000);
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
